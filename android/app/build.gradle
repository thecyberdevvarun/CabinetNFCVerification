plugins {
    id 'com.android.application'
}

android {
    namespace 'com.factory.cabinetvalidation'
    compileSdk 34

    defaultConfig {
        applicationId 'com.factory.cabinetvalidation'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dependencies {
        // SQL Server driver (direct database connection from the app)
        implementation 'net.sourceforge.jtds:jtds:1.3.1'
    }
}
